# Local development stack: Postgres + Redis.
# In production you point the server at your AWS RDS and ElastiCache instead
# (see server/.env.example). This file is only for running the whole thing on
# your machine to smoke-test the flow.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: polling
      POSTGRES_PASSWORD: polling
      POSTGRES_DB: polling
    ports:
      - "5433:5432" # 5433 on host to avoid clashing with a local pg on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - polling-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polling"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379" # 6380 on host to avoid clashing with a local redis
    networks:
      - polling-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    ports:
      - "8080:8080"
    environment:
      # Reach the databases by SERVICE NAME over the shared network (not localhost).
      DATABASE_URL: postgres://polling:polling@postgres:5432/polling
      REDIS_URL: redis://redis:6379
      PORT: "8080"
      WORKERS: "2"
      SESSION_SECRET: local-dev-secret-change-me
      ADMIN_TOKEN: admin-dev-token # host enters this in /admin to control the poll
      AUTO_START: "false" # wait for the host to click Start in /admin
      CORS_ORIGIN: "" # empty = allow any origin (dev). Set to your Vercel URL in prod.
      VOTE_SECONDS: "30"
      RESULTS_SECONDS: "8"
      LOBBY_SECONDS: "10"
      AUTO_SEED: "true" # seed the default questions on first boot if DB is empty
      SEED_COUNT: "100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - polling-net

# One shared network for all services. Containers on it reach each other by
# service name (e.g. "postgres:5432", "redis:6379") — no host ports needed for
# container-to-container traffic. If you later run the server in a container,
# add `networks: [polling-net]` to it and point it at postgres/redis by name.
networks:
  polling-net:
    driver: bridge

volumes:
  pgdata:
